<!DOCTYPE html>
<html lang="zh-CN" id="docroot">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;"
    />
    <title data-i18n="appName">钟毓英语衡水体字帖生成器</title>
  </head>
  <body>
    <div id="app">
      <div class="tabbar">
        <div class="tabs" id="tabs"></div>
        <button class="tab-new" id="btn-new-tab" data-i18n-title="ui.newTabTip" title="新建工程 (Ctrl+N)">＋</button>
      </div>
      <div class="workspace">
        <aside class="sidebar">
          <section class="panel">
            <h3 class="panel-title" data-i18n="ui.inputContent">输入内容</h3>
            <textarea
              id="inp-text"
              class="textarea"
              data-i18n-placeholder="ui.textPlaceholder"
              placeholder="请输入要生成字帖的英文内容..."
            ></textarea>
            <div class="ocr-row">
              <button
                class="btn btn-default btn-sm"
                id="btn-ocr"
                data-i18n="ui.ocrBtn"
                data-i18n-title="ui.ocrBtnTip"
                title="截取屏幕区域并识别其中的文字"
              >截图识别</button>
              <select class="input ocr-lang" id="ocr-lang" data-i18n-title="ui.ocrLangTip" title="OCR 识别语言">
                <option value="eng" data-i18n="ui.ocrLangEng">英文</option>
                <option value="chi_sim" data-i18n="ui.ocrLangChi">中文简体</option>
                <option value="eng+chi_sim" data-i18n="ui.ocrLangBoth">英文+中文</option>
              </select>
            </div>
            <div class="ocr-status" id="ocr-status" hidden></div>
          </section>

          <section class="panel">
            <h3 class="panel-title" data-i18n="ui.settings">调整设置</h3>
            <div class="grid2">
              <label class="field-label" for="inp-font-size" data-i18n="ui.fontSize">字体大小:</label>
              <input type="number" class="input" id="inp-font-size" min="10" max="50" step="1" />
              <label class="field-label" for="inp-spacing" data-i18n="ui.letterSpacing">字间距:</label>
              <input type="number" class="input" id="inp-spacing" min="-10" max="20" step="1" />
              <label class="field-label" for="inp-x" data-i18n="ui.offsetX">X轴偏移:</label>
              <input type="number" class="input" id="inp-x" min="-50" max="50" step="1" />
              <label class="field-label" for="inp-y" data-i18n="ui.offsetY">Y轴偏移:</label>
              <input type="number" class="input" id="inp-y" min="-50" max="50" step="1" />
            </div>
          </section>

          <section class="panel">
            <h3 class="panel-title" data-i18n="ui.lineType">线格类型</h3>
            <select class="input" id="inp-line-type">
              <!-- value 为工程文件枚举令牌（中文，勿翻译），显示文本走 i18n -->
              <option value="四线三格" data-i18n="ui.lineFour">四线三格</option>
              <option value="单横线" data-i18n="ui.lineSingle">单横线</option>
            </select>
          </section>

          <section class="panel">
            <h3 class="panel-title" data-i18n="ui.mode">生成模式</h3>
            <select class="input" id="inp-mode">
              <option value="描红" data-i18n="ui.modeTrace">描红</option>
              <option value="抄写" data-i18n="ui.modeCopy">抄写</option>
              <option value="描红+抄写" data-i18n="ui.modeTraceCopy">描红+抄写</option>
              <option value="字帖" data-i18n="ui.modeCopybook">字帖</option>
            </select>
          </section>

          <section class="panel">
            <h3 class="panel-title" data-i18n="ui.titleSettings">标题设置</h3>
            <label class="field-label" for="inp-title" data-i18n="ui.titleLabel">字帖标题:</label>
            <input type="text" class="input" id="inp-title" />
            <label class="checkbox">
              <input type="checkbox" id="inp-page-number" />
              <span data-i18n="ui.showPageNumber">显示页码</span>
            </label>
          </section>

          <section class="panel">
            <h3 class="panel-title" data-i18n="ui.customHeader">自定义头部</h3>
            <div class="header-actions">
              <button class="btn btn-default btn-sm" id="btn-add-header" data-i18n="ui.addField">添加字段</button>
              <button class="btn btn-default btn-sm" id="btn-remove-header" data-i18n="ui.removeField">删除字段</button>
            </div>
            <ul class="header-list" id="header-list"></ul>
          </section>
        </aside>

        <main class="preview-area">
          <div class="preview-toolbar">
            <div class="preview-title" data-i18n="ui.preview">预览效果</div>
            <div class="pager">
              <button
                class="btn btn-default pager-btn"
                id="btn-prev"
                data-i18n-title="ui.prevTip"
                title="上一页 (PageUp)"
              >←</button>
              <span class="page-label" id="page-label" data-i18n-page>第 1 页 / 共 1 页</span>
              <button
                class="btn btn-default pager-btn"
                id="btn-next"
                data-i18n-title="ui.nextTip"
                title="下一页 (PageDown)"
              >→</button>
            </div>
            <button class="btn btn-primary" id="btn-export" data-i18n="ui.exportPdf">导出PDF</button>
          </div>
          <div class="preview-scroll" id="preview-scroll">
            <div class="paper-wrap">
              <canvas id="preview-canvas"></canvas>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
