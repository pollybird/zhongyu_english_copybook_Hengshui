<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:;"
    />
    <title>打印预览</title>
    <style>
      @font-face {
        font-family: 'HengshuiFont';
        src: url('./src/assets/fonts/舒窈英文衡水体.ttf') format('truetype');
        font-display: block;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        background: #525659;
      }

      #toolbar {
        height: 48px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 12px;
        background: #f3f4f6;
        border-bottom: 1px solid #d1d5db;
        user-select: none;
      }

      #btn-print {
        height: 30px;
        padding: 0 18px;
        border: none;
        border-radius: 4px;
        background: #2563eb;
        color: #fff;
        font-size: 13px;
        cursor: pointer;
      }

      #btn-print:hover {
        background: #1d4ed8;
      }

      #btn-print:disabled {
        background: #93c5fd;
        cursor: default;
      }

      .group {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .group button {
        width: 26px;
        height: 26px;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        background: #fff;
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
      }

      .group button:hover {
        background: #e5e7eb;
      }

      #zoom-fit {
        width: auto;
        padding: 0 8px;
        font-size: 12px;
      }

      #zoom-label {
        min-width: 44px;
        text-align: center;
        font-size: 13px;
        color: #374151;
      }

      #page-indicator {
        margin-left: auto;
        font-size: 13px;
        color: #374151;
      }

      #scroll {
        position: absolute;
        top: 48px;
        bottom: 0;
        left: 0;
        right: 0;
        overflow: auto;
      }

      #pages {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 16px;
        width: max-content;
        min-width: 100%;
      }

      /* 页面为标准 A4（210mm x 297mm），内部 800x1131 坐标的画布均匀缩放铺满 */
      .pdf-page {
        width: 210mm;
        height: 297mm;
        overflow: hidden;
        background: #fff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
        flex-shrink: 0;
      }

      .pdf-page canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <button id="btn-print">打印</button>
      <div class="group">
        <button id="zoom-out" title="缩小">−</button>
        <span id="zoom-label">100%</span>
        <button id="zoom-in" title="放大">＋</button>
        <button id="zoom-fit">适应页宽</button>
      </div>
      <span id="page-indicator"></span>
    </div>
    <div id="scroll">
      <div id="pages"></div>
    </div>
    <script type="module" src="./src/preview.js"></script>
  </body>
</html>
